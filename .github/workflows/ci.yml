# Vérification automatique à chaque envoi sur GitHub : qualité du code, tests de l'API, compilation de l'interface
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API (ESLint + tests Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Interface (ESLint + tests Vitest + compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Parcours complets (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultats
          path: frontend/test-results
          retention-days: 7
